<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONECTA - Login</title>
<style>
  :root { --verde:#1B4332; --ok:#2D6A4F; --erro:#BC4749; --amarelo:#FEE440; --fundo:#F8F9FA; --texto:#212529; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family:system-ui,"Segoe UI",Arial,sans-serif; background:var(--fundo); color:var(--texto); }
  .card { width:100%; max-width:460px; background:#fff; border-radius:16px; padding:36px 40px; box-shadow:0 4px 24px #0000001a; }
  .logo { width:72px; height:72px; margin:0 auto 12px; border-radius:16px; background:var(--verde); color:var(--amarelo);
          display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:800; }
  h1 { margin:0; text-align:center; color:var(--verde); font-size:28px; }
  .sub { text-align:center; color:#6c757d; margin:2px 0 24px; }
  h2 { text-align:center; font-size:22px; margin:0 0 20px; }
  label.campo { display:block; font-weight:600; margin:14px 0 6px; font-size:14px; }
  .input { position:relative; }
  input[type=email], input[type=password], input[type=text] { width:100%; font-size:16px; padding:13px 14px; border:1px solid #ced4da; border-radius:10px; }
  input:focus { outline:2px solid var(--verde); border-color:transparent; }
  #olho { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer; font-size:18px; width:auto; padding:6px; }
  .lgpd { display:flex; align-items:center; gap:10px; margin:18px 0; font-size:14px; }
  .lgpd input { width:20px; height:20px; accent-color:var(--verde); }
  .lgpd a { color:var(--verde); font-weight:600; }
  #entrar { width:100%; padding:14px; border:0; border-radius:10px; font-size:16px; font-weight:700; letter-spacing:1px; color:#fff; background:var(--verde); cursor:pointer; }
  #entrar:disabled { background:#adb5bd; cursor:not-allowed; }
  #erro { display:none; margin-top:14px; padding:10px 12px; border-radius:8px; background:#BC474922; color:#8c2f31; font-size:14px; }
  #info { display:none; margin-top:14px; padding:10px 12px; border-radius:8px; background:#FEE44055; font-size:14px; }
  .links { text-align:center; margin-top:20px; font-size:14px; color:#6c757d; }
  .demo { margin-top:20px; padding:10px 12px; background:#f1f3f5; border-radius:8px; font-size:12px; color:#555; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">C</div>
  <h1>CONECTA</h1>
  <div class="sub">Gestão de Parceiros</div>
  <h2>Acesse sua Conta</h2>
  <form id="form">
    <label class="campo" for="email">E-mail Corporativo</label>
    <input id="email" type="email" placeholder="nome@empresa.com.br" autocomplete="username" required>

    <label class="campo" for="senha">Senha</label>
    <div class="input">
      <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" id="olho" aria-label="Mostrar senha">👁</button>
    </div>

    <label class="lgpd"><input type="checkbox" id="aceite"> <span>Li e aceito os <a href="#">Termos de Privacidade e LGPD</a></span></label>

    <button id="entrar" disabled>ENTRAR</button>
    <div id="erro"></div>
    <div id="info"></div>
  </form>
  <div class="links">Esqueceu sua senha?<br>Empresa não cadastrada? Fale conosco.</div>
  <div class="demo"><b>Demonstração</b> — portaria@conecta.com · admin@conecta.com · terceirizada@conecta.com<br>Senha de todos: conecta123</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  $('aceite').addEventListener('change', () => { $('entrar').disabled = !$('aceite').checked; });
  $('olho').addEventListener('click', () => { $('senha').type = $('senha').type === 'password' ? 'text' : 'password'; });

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('erro').style.display = 'none'; $('info').style.display = 'none';
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, senha: $('senha').value, aceite: $('aceite').checked })
    });
    const d = await r.json();
    if (!r.ok) { $('erro').textContent = d.erro; $('erro').style.display = 'block'; return; }
    if (d.destino) { location.href = d.destino; return; }
    $('info').textContent = 'Login validado (perfil ' + d.perfil + '). A tela deste perfil ainda está em desenvolvimento.';
    $('info').style.display = 'block';
  });
</script>
</body>
</html>
