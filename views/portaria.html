<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONECTA - Portaria</title>
<link rel="stylesheet" href="/app.css">
<style>
  .portaria { max-width:680px; margin:24px auto; text-align:center; }
  .portaria form { display:flex; gap:10px; }
  .portaria input { font-size:1.4rem; text-align:center; letter-spacing:1px; padding:16px; border-radius:12px; }
  #card { margin-top:32px; border-radius:22px; padding:44px 24px; color:#fff; display:none; }
  #card.ok { background:var(--ok); } #card.neg { background:var(--erro); }
  #avatar { width:104px; height:104px; border-radius:50%; background:#ffffff33; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:2.4rem; font-weight:700; }
  #resultado { font-size:2.8rem; font-weight:800; letter-spacing:2px; margin:0 0 12px; }
  #nome { font-size:1.4rem; margin:0; } #empresa { margin:4px 0 0; opacity:.9; } #motivo { margin:16px 0 0; font-size:1.15rem; font-weight:600; }
</style>
</head>
<body>
<main id="conteudo">
  <div class="portaria">
    <h1 class="titulo">Módulo Portaria</h1>
    <p class="sub">Digite o CPF do colaborador <span id="status" class="muted"></span></p>
    <form id="form">
      <input id="cpf" type="text" placeholder="CPF do Colaborador" maxlength="14" autofocus autocomplete="off" aria-label="CPF do colaborador">
      <button class="btn" style="padding:0 28px">Consultar</button>
    </form>
    <div id="card" role="alert">
      <div id="avatar"></div>
      <h3 id="resultado"></h3>
      <p id="nome"></p><p id="empresa"></p><p id="motivo"></p>
    </div>
  </div>
</main>
<script src="/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  fetch('/api/teste-conexao').then(r => r.json()).then(d => { $('status').textContent = d.conectado ? '· Banco conectado ✔ (' + d.banco + ')' : '· Sem conexão com o banco ✖'; })
    .catch(() => { $('status').textContent = '· Servidor fora do ar ✖'; });

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const d = await CONECTA.api('/api/portaria/' + encodeURIComponent($('cpf').value));
      const liberado = d.resultado === 'LIBERADO';
      $('card').style.display = 'block';
      $('card').className = liberado ? 'ok' : 'neg';
      $('avatar').textContent = d.nome ? CONECTA.iniciais(d.nome) : '?';
      $('resultado').textContent = d.resultado;
      $('nome').textContent = d.nome || '';
      $('empresa').textContent = d.empresa || '';
      $('motivo').textContent = liberado ? '' : 'Motivo: ' + d.motivo;
      $('cpf').select();
    } catch (err) { CONECTA.toast(err.message, true); }
  });
  CONECTA.iniciar('portaria');
</script>
</body>
</html>
